name: Deploy Cloudflare cron

on:
  push:
    branches: [main]
    paths:
      - .cron/**
      - .github/workflows/cloudflare-cron.yml
      - .github/workflows/daily.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-cron
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Deploy Worker and sync dispatch token
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.148.0"
          workingDirectory: .cron
          secrets: GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
