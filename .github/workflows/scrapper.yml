name: Rebuild Wayback history

on:
  schedule:
    - cron: "5 3 5 * *"
  workflow_dispatch:

concurrency:
  group: promo-history
  cancel-in-progress: false

jobs:
  rebuild:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: snapshots_cache
          key: wayback-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            wayback-${{ runner.os }}-
      - run: bun run scrapper
      - name: Commit rebuilt history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add web/promo_history.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild promo history"
          gh auth setup-git
          git push
      - name: Upload snapshot cache
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshots-cache-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshots_cache/
          if-no-files-found: ignore
          retention-days: 1
